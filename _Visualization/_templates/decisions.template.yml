# ============================================================================
# Status Legend
# ============================================================================
# - proposed: Initial proposal, open for discussion
# - under_review: Being actively reviewed by stakeholders
# - decided: Final decision made
# - deprecated: No longer relevant or superseded

# ============================================================================
# Best Practices
# ============================================================================
# 1. One decision per significant choice
# 2. Keep context concise but complete
# 3. List all viable options (2-4 typically)
# 4. Be specific about pros/cons
# 5. Document rationale clearly
# 6. Update status as decision evolves
# 7. Link related decisions
