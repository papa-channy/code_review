# ============================================================================
# Architecture Decision Records (ADR) Template
# ============================================================================
# Copy this template to your scenario folder as decisions.yml
# Replace placeholders and add your decisions

schema_version: "1.0"
scenario_id: "{SCENARIO_ID}"
scenario_name: "{SCENARIO_NAME}"

# ============================================================================
# Decisions
# ============================================================================

decisions:
  - id: "DEC-001"
    title: "{DECISION_TITLE}"
    status: "proposed"  # proposed | under_review | decided | deprecated
    date: "{DATE}"

    # Context: Why is this decision needed?
    context: |
      Describe the context and problem statement.
      What forces are at play? What constraints exist?

    # Options: What are the alternatives?
    options:
      - id: "A"
        name: "Option A Name"
        pros:
          - "Advantage 1"
          - "Advantage 2"
        cons:
          - "Disadvantage 1"
          - "Disadvantage 2"

      - id: "B"
        name: "Option B Name"
        pros:
          - "Advantage 1"
        cons:
          - "Disadvantage 1"

    # Decision: Which option was selected? (null if not yet decided)
    decision: null  # "A" | "B" | null

    # Rationale: Why was this option chosen?
    rationale: |
      Explain why this option was selected.
      Include trade-offs considered.

    # Consequences: What are the implications?
    consequences:
      - "Consequence 1"
      - "Consequence 2"

    # Related: Links to other decisions
    related_decisions: []  # ["DEC-002", "DEC-003"]

