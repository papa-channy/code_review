# ============================================================================
# CR-06: Auto Classification
# ============================================================================
# Automatic classification based on path patterns, keywords, and heuristics
# Based on CLAUDE.md Section 9: Auto-Classification Criteria
#
# This scenario extends CR-01 by providing automatic classification logic
# that can be applied before or during manual review.

schema_version: "2.0"
scenario_id: "CR-06"
scenario_name: "Auto Classification"
scenario_name_ko: "자동 분류"
last_updated: "2026-01-26"

# ============================================================================
# Entities
# ============================================================================
entities:
  - ref: "pull_request"
  - ref: "auto_classifier"
  - ref: "path_pattern"
  - ref: "keyword_pattern"
  - ref: "classifier"
  - ref: "code_diff"

# ============================================================================
# Nodes
# ============================================================================
nodes:
  # Start
  - id: "N10"
    entity: "pull_request"
    label: "Receive PR"
    label_ko: "PR 수신"
    kind: "start"
    order: 10
    description: "Receive pull request for automatic classification"
    description_ko: "자동 분류를 위한 PR 수신"

  # Extract Information
  - id: "N20"
    entity: "code_diff"
    label: "Extract PR Metadata"
    label_ko: "PR 메타데이터 추출"
    kind: "action"
    order: 20
    description: "Extract file paths, commit messages, LOC, keywords"
    description_ko: "파일 경로, 커밋 메시지, LOC, 키워드 추출"
    meta:
      extracts:
        - "File paths (changed files)"
        - "Commit messages"
        - "PR title and description"
        - "Lines of code (added/deleted)"
        - "Code content keywords"

  # Risk Level Auto-Classification
  - id: "N30"
    entity: "auto_classifier"
    label: "Auto-Classify Risk Level"
    label_ko: "Risk Level 자동 분류"
    kind: "action"
    order: 30
    description: "Match path patterns and keywords to determine risk"
    description_ko: "경로 패턴과 키워드 매칭으로 위험도 결정"
    meta:
      path_patterns:
        CRITICAL: ["auth/", "security/", "payment/", "crypto/", "pii/", "secret/", "credential/"]
        HIGH: ["core/", "domain/", "api/", "db/", "schema/", "migration/", "transaction/"]
        MEDIUM: ["feature/", "service/", "handler/", "controller/", "repository/"]
        LOW: ["docs/", "test/", "spec/", "config/", "readme", ".md", "mock/"]
      keywords:
        CRITICAL: ["password", "token", "secret", "encrypt", "decrypt", "apikey", "credential", "private_key"]
        HIGH: ["transaction", "migration", "contract", "interface", "schema", "breaking_change"]
        MEDIUM: ["feature", "add", "update", "modify"]
        LOW: ["doc", "comment", "typo", "style", "format", "readme"]

  # Size Calculation
  - id: "N40"
    entity: "auto_classifier"
    label: "Calculate Size"
    label_ko: "Size 계산"
    kind: "action"
    order: 40
    description: "Calculate LOC from git diff statistics"
    description_ko: "git diff 통계에서 LOC 계산"
    meta:
      size_mapping:
        XS: "1-50 LOC"
        S: "51-100 LOC"
        M: "101-200 LOC"
        L: "201-500 LOC"
        XL: "500+ LOC"

  # Change Type Auto-Classification
  - id: "N50"
    entity: "auto_classifier"
    label: "Auto-Classify Change Type"
    label_ko: "Change Type 자동 분류"
    kind: "action"
    order: 50
    description: "Match commit message keywords to determine change type"
    description_ko: "커밋 메시지 키워드 매칭으로 변경 유형 결정"
    meta:
      keywords:
        Corrective: ["fix", "bug", "hotfix", "patch", "resolve", "issue", "error", "defect", "crash"]
        Adaptive: ["upgrade", "migrate", "update dependency", "version", "compatibility", "bump", "renovate"]
        Perfective: ["feat", "feature", "add", "implement", "enhance", "improve", "optimize", "perf"]
        Preventive: ["refactor", "restructure", "cleanup", "tech debt", "reorganize", "chore", "rename"]

  # Sensitivity Auto-Classification
  - id: "N60"
    entity: "auto_classifier"
    label: "Auto-Classify Sensitivity"
    label_ko: "Sensitivity 자동 분류"
    kind: "action"
    order: 60
    description: "Match regulatory patterns to determine sensitivity"
    description_ko: "규제 관련 패턴 매칭으로 민감도 결정"
    meta:
      patterns:
        SOX:
          paths: ["finance/", "audit/", "accounting/", "journal/"]
          keywords: ["audit", "financial", "accounting", "ledger", "fiscal"]
        PCI-DSS:
          paths: ["payment/", "checkout/", "billing/", "card/"]
          keywords: ["card", "payment", "pan", "cvv", "checkout", "stripe", "paypal"]
        HIPAA:
          paths: ["health/", "medical/", "patient/", "clinical/"]
          keywords: ["patient", "medical", "health", "phi", "diagnosis", "prescription"]
        GDPR:
          paths: ["user/", "privacy/", "consent/", "personal/"]
          keywords: ["personal", "pii", "consent", "user_data", "privacy", "gdpr", "data_subject"]

  # Domain Hint
  - id: "N70"
    entity: "auto_classifier"
    label: "Detect Domain Hints"
    label_ko: "Domain 힌트 감지"
    kind: "action"
    order: 70
    description: "Suggest domain type based on path patterns"
    description_ko: "경로 패턴 기반 도메인 유형 제안"
    meta:
      hints:
        Core: ["domain/", "core/", "business/"]
        Supporting: ["service/", "adapter/", "integration/", "notification/", "email/", "sms/"]
        Generic: ["util/", "utils/", "common/", "lib/", "helper/", "infrastructure/", "shared/"]
      note: "Domain requires manual confirmation in most cases"

  # Confidence Check
  - id: "N80"
    entity: "auto_classifier"
    label: "Calculate Confidence"
    label_ko: "신뢰도 계산"
    kind: "decision"
    order: 80
    description: "Determine if auto-classification confidence is high enough"
    description_ko: "자동 분류 신뢰도가 충분한지 확인"
    meta:
      high_confidence: "Multiple patterns match, no conflicts"
      low_confidence: "Few matches, conflicting signals"

  # High Confidence Path
  - id: "N81"
    entity: "classifier"
    label: "Apply Auto-Classification"
    label_ko: "자동 분류 적용"
    kind: "action"
    order: 81
    description: "Apply classification with high confidence"
    description_ko: "높은 신뢰도로 분류 적용"

  # Low Confidence Path
  - id: "N82"
    entity: "classifier"
    label: "Flag for Manual Review"
    label_ko: "수동 검토 플래그"
    kind: "action"
    order: 82
    description: "Mark classification as tentative, needs manual confirmation"
    description_ko: "분류를 잠정적으로 표시, 수동 확인 필요"
    meta:
      principle: "When uncertain, default to higher tier"

  # Output
  - id: "N90"
    entity: "pull_request"
    label: "Classification Complete"
    label_ko: "분류 완료"
    kind: "end"
    order: 90
    description: "Auto-classification complete, labels attached"
    description_ko: "자동 분류 완료, 라벨 부착됨"
    meta:
      outputs:
        - "Risk Level (with confidence)"
        - "Size"
        - "Change Type (with confidence)"
        - "Sensitivity (with confidence)"
        - "Domain Hint (suggestion only)"

# ============================================================================
# Edges
# ============================================================================
edges:
  - id: "E10"
    source: "N10"
    target: "N20"
    label: "extract"
    label_ko: "추출"
    kind: "main"
    order: 11

  - id: "E20"
    source: "N20"
    target: "N30"
    label: "analyze"
    label_ko: "분석"
    kind: "main"
    order: 21

  - id: "E30"
    source: "N30"
    target: "N40"
    label: "next"
    label_ko: "다음"
    kind: "main"
    order: 31

  - id: "E40"
    source: "N40"
    target: "N50"
    label: "next"
    label_ko: "다음"
    kind: "main"
    order: 41

  - id: "E50"
    source: "N50"
    target: "N60"
    label: "next"
    label_ko: "다음"
    kind: "main"
    order: 51

  - id: "E60"
    source: "N60"
    target: "N70"
    label: "next"
    label_ko: "다음"
    kind: "main"
    order: 61

  - id: "E70"
    source: "N70"
    target: "N80"
    label: "evaluate"
    label_ko: "평가"
    kind: "main"
    order: 71

  # Confidence branches
  - id: "E80H"
    source: "N80"
    target: "N81"
    label: "High Confidence"
    label_ko: "높은 신뢰도"
    kind: "main"
    order: 81
    condition: "Multiple pattern matches, no conflicts"

  - id: "E80L"
    source: "N80"
    target: "N82"
    label: "Low Confidence"
    label_ko: "낮은 신뢰도"
    kind: "alt"
    order: 82
    condition: "Few matches or conflicting signals"

  # Merge to end
  - id: "E81"
    source: "N81"
    target: "N90"
    label: "complete"
    label_ko: "완료"
    kind: "main"
    order: 91

  - id: "E82"
    source: "N82"
    target: "N90"
    label: "complete"
    label_ko: "완료"
    kind: "main"
    order: 92

# ============================================================================
# Paths
# ============================================================================
paths:
  main:
    name: "High Confidence Path"
    name_ko: "높은 신뢰도 경로"
    nodes: ["N10", "N20", "N30", "N40", "N50", "N60", "N70", "N80", "N81", "N90"]
    description: "Auto-classification applied with high confidence"

  manual_review:
    name: "Manual Review Required"
    name_ko: "수동 검토 필요"
    nodes: ["N10", "N20", "N30", "N40", "N50", "N60", "N70", "N80", "N82", "N90"]
    description: "Low confidence, flagged for manual confirmation"

# ============================================================================
# Annotations
# ============================================================================
annotations:
  - target: "N30"
    type: "info"
    text: "Path patterns take priority over keywords"
    text_ko: "경로 패턴이 키워드보다 우선"

  - target: "N50"
    type: "info"
    text: "First matching keyword pattern wins"
    text_ko: "첫 번째 매칭되는 키워드 패턴 적용"

  - target: "N70"
    type: "warning"
    text: "Domain usually requires manual judgment"
    text_ko: "도메인은 보통 수동 판단 필요"

  - target: "N82"
    type: "critical"
    text: "When uncertain, default to higher tier"
    text_ko: "불확실하면 상위 Tier로 기본 설정"

# ============================================================================
# Layout
# ============================================================================
layout:
  direction: "TB"
  node_spacing: 60
  rank_spacing: 80
