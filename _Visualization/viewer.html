                          ${getOptionPros(opt).length ? `
                            <div class="text-xs text-green-400 mb-1">
                              <span class="font-semibold">${state.language === 'ko' ? '장점' : 'Pros'}:</span>
                              ${getOptionPros(opt).map(p => `<span class="ml-2">+ ${p}</span>`).join('')}
                            </div>
                          ` : ''}
                          ${getOptionCons(opt).length ? `
                            <div class="text-xs text-red-400">
                              <span class="font-semibold">${state.language === 'ko' ? '단점' : 'Cons'}:</span>
                              ${getOptionCons(opt).map(c => `<span class="ml-2">- ${c}</span>`).join('')}
                            </div>
                          ` : ''}
                        </div>
                      `).join('')}
                    </div>
                  ` : ''}

                  ${getText(dec, 'rationale') ? `
                    <div class="mb-4">
                      <h4 class="text-sm font-semibold text-gray-400 mb-2">${state.language === 'ko' ? '결정 근거' : 'Rationale'}</h4>
                      <p class="text-sm text-gray-300">${getText(dec, 'rationale')}</p>
                    </div>
                  ` : ''}

                  ${getConsequences(dec).length ? `
                    <div>
                      <h4 class="text-sm font-semibold text-gray-400 mb-2">${state.language === 'ko' ? '결과 및 영향' : 'Consequences'}</h4>
                      <ul class="text-sm text-gray-300 list-disc list-inside">
                        ${getConsequences(dec).map(c => `<li>${c}</li>`).join('')}
                      </ul>
                    </div>
                  ` : ''}
                </div>
              </div>
            `).join('')}
          </div>
        `;
      } catch (err) {
        console.error('Decisions parse failed:', err);
        container.innerHTML = `
          <div class="bg-red-900/20 border border-red-800 rounded-lg p-4">
            <h3 class="text-red-400 font-semibold mb-2">${state.language === 'ko' ? '결정 목록 파싱 오류' : 'Decisions Parse Error'}</h3>
            <pre class="text-xs text-red-300">${err.message}</pre>
          </div>
        `;
      }
    }

    function getDecisionStatusColor(status) {
      const colors = {
        'proposed': 'draft',
        'under_review': 'review',
        'decided': 'approved',
        'deprecated': 'low'
      };
      return colors[status] || 'draft';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // =========================================================================
    // Search
    // =========================================================================
    function filterScenarios(term) {
      state.searchTerm = term.toLowerCase();

      document.querySelectorAll('.scenario-item').forEach(item => {
        const id = item.dataset.scenario.toLowerCase();
        const text = item.textContent.toLowerCase();
        const match = !state.searchTerm || id.includes(state.searchTerm) || text.includes(state.searchTerm);
        item.style.display = match ? '' : 'none';
      });

      // Show/hide flow sections based on visible scenarios
      document.querySelectorAll('.flow-section').forEach(section => {
        const hasVisible = section.querySelectorAll('.scenario-item:not([style*="display: none"])').length > 0;
        section.style.display = hasVisible ? '' : 'none';
      });
    }

    // =========================================================================
    // Event Listeners
    // =========================================================================
    document.getElementById('search-input').addEventListener('input', e => {
      filterScenarios(e.target.value);
    });

    document.getElementById('refresh-btn').addEventListener('click', async () => {
      if (state.currentScenario) {
        const flow = state.scenarioList.flows.find(f =>
          f.scenarios.some(s => s.id === state.currentScenario.id)
        );
        await loadScenario(state.currentScenario.id, flow.id);
      }
    });

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.currentTab = btn.dataset.tab;
        if (state.currentScenario) {
          renderCurrentTab();
        }
      });
    });

    // Initialize: Load shared entities first, then scenario list
    (async () => {
      await loadSharedEntities();
      await loadScenarioList();
    })();

    // =========================================================================
    // Mermaid Generator from Graph IR
    // =========================================================================
    let currentMermaidType = 'flowchart';
    let generatedMermaidCode = '';

    function showMermaidGenerator() {
      if (!state.graphIR) {
        showToast(state.language === 'ko' ? '그래프 IR이 없습니다' : 'No Graph IR available');
        return;
      }

      const modal = document.getElementById('mermaid-generator-modal');
      modal?.classList.add('visible');

      // Generate with default type
      setMermaidType('flowchart');
    }

    function hideMermaidGenerator() {
      const modal = document.getElementById('mermaid-generator-modal');
      modal?.classList.remove('visible');
    }

    function setMermaidType(type) {
      currentMermaidType = type;

      // Update active button
      document.querySelectorAll('.mermaid-type-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.type === type);
      });

      // Generate code
      generatedMermaidCode = generateMermaidFromIR(state.graphIR, type);

      // Display
      const codeEl = document.getElementById('generated-mermaid-code');
      if (codeEl) {
        codeEl.textContent = generatedMermaidCode;
      }
    }

    function generateMermaidFromIR(ir, type = 'flowchart') {
      if (!ir) return '';

      switch (type) {
        case 'flowchart':
          return generateFlowchart(ir);
        case 'sequence':
          return generateSequenceDiagram(ir);
        case 'state':
          return generateStateDiagram(ir);
        default:
          return generateFlowchart(ir);
      }
    }

    // =========================================================================
    // Flowchart Generator
    // =========================================================================
    function generateFlowchart(ir) {
      const direction = ir.layout?.direction || 'TB';
      let lines = [`flowchart ${direction}`];
      lines.push('');

      // Build entity map for styling
      const entityColors = {};
      ir.entities?.forEach(e => {
        entityColors[e.id] = e.color || '#3b82f6';
      });

      // Group nodes by entity for subgraphs
      const nodesByEntity = {};
      ir.nodes?.forEach(n => {
        if (!nodesByEntity[n.entity]) {
          nodesByEntity[n.entity] = [];
        }
        nodesByEntity[n.entity].push(n);
      });

      // Generate subgraphs for each entity
      ir.entities?.forEach(entity => {
        const nodes = nodesByEntity[entity.id] || [];
        if (nodes.length === 0) return;

        lines.push(`  subgraph ${entity.id}["${entity.label}"]`);

        nodes.forEach(n => {
          const shape = getNodeShape(n.kind);
          const label = escapeLabel(n.label);
          lines.push(`    ${n.id}${shape.open}"${label}"${shape.close}`);
        });

        lines.push('  end');
        lines.push('');
      });

      // Generate edges
      lines.push('  %% Edges');
      ir.edges?.forEach(e => {
        const arrowStyle = getEdgeStyle(e.kind);
        const label = e.label ? `|${escapeLabel(e.label)}|` : '';
        lines.push(`  ${e.source} ${arrowStyle} ${label} ${e.target}`);
      });

      // Add styling
      lines.push('');
      lines.push('  %% Styling');

      // Style nodes by kind
      const startNodes = ir.nodes?.filter(n => n.kind === 'start').map(n => n.id) || [];
      const endNodes = ir.nodes?.filter(n => n.kind === 'end').map(n => n.id) || [];
      const errorNodes = ir.nodes?.filter(n => n.kind === 'error').map(n => n.id) || [];
      const decisionNodes = ir.nodes?.filter(n => n.kind === 'decision').map(n => n.id) || [];

      if (startNodes.length) {
        lines.push(`  style ${startNodes.join(',')} fill:#22c55e,stroke:#22c55e,color:#fff`);
      }
      if (endNodes.length) {
        lines.push(`  style ${endNodes.join(',')} fill:#3b82f6,stroke:#3b82f6,color:#fff`);
      }
      if (errorNodes.length) {
        lines.push(`  style ${errorNodes.join(',')} fill:#ef4444,stroke:#ef4444,color:#fff`);
      }

      // Style subgraphs
      ir.entities?.forEach(entity => {
        lines.push(`  style ${entity.id} fill:${entity.color}15,stroke:${entity.color}`);
      });

      return lines.join('\n');
    }

    function getNodeShape(kind) {
      switch (kind) {
        case 'start':
          return { open: '([', close: '])' };  // Stadium (rounded)
        case 'end':
          return { open: '([', close: '])' };  // Stadium (rounded)
        case 'decision':
          return { open: '{', close: '}' };    // Diamond
        case 'error':
          return { open: '[[', close: ']]' };  // Subroutine
        case 'wait':
          return { open: '>>', close: ']' };   // Asymmetric
        default:
          return { open: '[', close: ']' };    // Rectangle
      }
    }

    function getEdgeStyle(kind) {
      switch (kind) {
        case 'main':
          return '==>';      // Thick arrow
        case 'alt':
          return '-->';      // Normal arrow
        case 'exception':
          return '-.->';     // Dotted arrow
        case 'background':
          return '-..->';    // Long dotted
        default:
          return '-->';
      }
    }

    // =========================================================================
    // Sequence Diagram Generator
    // =========================================================================
    function generateSequenceDiagram(ir) {
      let lines = ['sequenceDiagram'];
      lines.push('  autonumber');
      lines.push('');

      // Declare participants
      lines.push('  %% Participants');
      ir.entities?.forEach(e => {
        const type = e.type === 'actor' ? 'actor' : 'participant';
        lines.push(`  ${type} ${e.id} as ${e.label}`);
      });
      lines.push('');

      // Sort edges by order
      const sortedEdges = [...(ir.edges || [])].sort((a, b) => (a.order || 0) - (b.order || 0));

      // Build node to entity map
      const nodeEntity = {};
      ir.nodes?.forEach(n => {
        nodeEntity[n.id] = n.entity;
      });

      // Generate messages
      lines.push('  %% Messages');
      sortedEdges.forEach(e => {
        const sourceEntity = nodeEntity[e.source];
        const targetEntity = nodeEntity[e.target];

        if (!sourceEntity || !targetEntity) return;

        // Find target node label
        const targetNode = ir.nodes?.find(n => n.id === e.target);
        const message = targetNode?.label || e.label || 'message';

        // Determine arrow type
        let arrow = '->>';
        if (e.kind === 'exception') {
          arrow = '--x';
        } else if (e.kind === 'background') {
          arrow = '-->>';
        } else if (sourceEntity === targetEntity) {
          arrow = '->>'; // Self-call
        }

        lines.push(`  ${sourceEntity}${arrow}${targetEntity}: ${escapeLabel(message)}`);

        // Add note for description
        if (targetNode?.description) {
          lines.push(`  Note right of ${targetEntity}: ${escapeLabel(targetNode.description)}`);
        }
      });

      return lines.join('\n');
    }

    // =========================================================================
    // State Diagram Generator
    // =========================================================================
    function generateStateDiagram(ir) {
      let lines = ['stateDiagram-v2'];
      lines.push('  direction ' + (ir.layout?.direction || 'TB'));
      lines.push('');

      // Start state
      const startNode = ir.nodes?.find(n => n.kind === 'start');
      if (startNode) {
        lines.push(`  [*] --> ${startNode.id}`);
      }

      // States (nodes)
      lines.push('  %% States');
      ir.nodes?.forEach(n => {
        if (n.kind === 'start' || n.kind === 'end') return;

        lines.push(`  ${n.id}: ${escapeLabel(n.label)}`);

        // Add description as note
        if (n.description) {
          lines.push(`  note right of ${n.id}`);
          lines.push(`    ${escapeLabel(n.description)}`);
          lines.push('  end note');
        }
      });
      lines.push('');

      // Transitions (edges)
      lines.push('  %% Transitions');
      ir.edges?.forEach(e => {
        const label = e.label ? `: ${escapeLabel(e.label)}` : '';
        lines.push(`  ${e.source} --> ${e.target}${label}`);
      });

      // End states
      const endNodes = ir.nodes?.filter(n => n.kind === 'end') || [];
      endNodes.forEach(n => {
        lines.push(`  ${n.id} --> [*]`);
      });

      return lines.join('\n');
    }

    function escapeLabel(text) {
      if (!text) return '';
      return text
        .replace(/"/g, "'")
        .replace(/\n/g, ' ')
        .replace(/[<>]/g, '')
        .substring(0, 100); // Limit length
    }

    // =========================================================================
    // Mermaid Generator Actions
    // =========================================================================
    function copyGeneratedMermaid() {
      if (!generatedMermaidCode) return;

      navigator.clipboard.writeText(generatedMermaidCode).then(() => {
        showToast(state.language === 'ko' ? '클립보드에 복사되었습니다!' : 'Copied to clipboard!', 'success');
      }).catch(err => {
        console.error('Copy failed:', err);
        showToast(state.language === 'ko' ? '복사에 실패했습니다' : 'Copy failed');
      });
    }

    function downloadGeneratedMermaid() {
      if (!generatedMermaidCode) return;

      const blob = new Blob([generatedMermaidCode], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = `${state.currentScenario?.id || 'diagram'}_generated.mermaid`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      showToast(state.language === 'ko' ? '다운로드 완료!' : 'Downloaded!', 'success');
    }

    function applyGeneratedMermaid() {
      if (!generatedMermaidCode) return;

      // Store generated code
      state.files.diagram = generatedMermaidCode;

      // Close modal
      hideMermaidGenerator();

      // Switch to diagram tab
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelector('.tab-btn[data-tab="diagram"]')?.classList.add('active');
      state.currentTab = 'diagram';

      // Render
      renderCurrentTab();

      showToast(state.language === 'ko' ? '다이어그램 탭에 적용했습니다!' : 'Applied to Diagram tab!', 'success');
    }

    // =========================================================================
    // Export Graph as PNG
    // =========================================================================
    function exportGraphPNG() {
      if (!state.cyInstance) {
        showToast(state.language === 'ko' ? '내보낼 그래프가 없습니다' : 'No graph to export');
        return;
      }

      const png = state.cyInstance.png({
        output: 'blob',
        bg: '#0f172a',
        scale: 2,
        full: true
      });

      const url = URL.createObjectURL(png);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${state.currentScenario?.id || 'graph'}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      showToast(state.language === 'ko' ? '그래프를 PNG로 내보냈습니다!' : 'Graph exported as PNG!', 'success');
    }

    // =========================================================================
    // Toast Notification
    // =========================================================================
    function showToast(message, type = '') {
      // Remove existing toast
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();

      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      document.body.appendChild(toast);

      // Trigger animation
      requestAnimationFrame(() => {
        toast.classList.add('visible');
      });

      // Auto-hide
      setTimeout(() => {
        toast.classList.remove('visible');
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }
  </script>
</body>
</html>
